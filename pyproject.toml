[project]
name = "caes-prediagnostico"
version = "0.1.0"
description = "Prediagnóstico de proyectos de eficiencia energética con CAEs."
requires-python = ">=3.10"
dependencies = [
  "python-docx==1.1.2",
  "reportlab==4.2.2",
  "pdfplumber==0.11.4",
  "pandas==2.2.2",
  "openpyxl==3.1.5",
]

[project.scripts]
caes-prediagnostico = "caes_prediagnostico.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
